<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Abe Weston</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">Abe Weston</a>
            <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="nav-menu">Menu</button>
            <ul class="nav-menu" id="nav-menu">
                <!-- Navigation loaded dynamically -->
            </ul>
        </div>
    </header>

    <main>
        <section class="contact-page">
            <div class="container">
                <h1 class="page-heading">Contact Me</h1>

                <div class="contact-layout">
                    <figure class="contact-artwork" id="contact-artwork" style="display: none;">
                        <img src="" alt="">
                    </figure>

                    <div class="contact-main">
                <p class="section-intro" id="contact-intro"></p>

                <form id="contact-form" class="contact-form" novalidate>
                    <div class="form-row form-row-split">
                        <div>
                            <label for="contact-first-name">First Name <span class="required-mark" aria-hidden="true">*</span></label>
                            <input type="text" id="contact-first-name" name="firstName" autocomplete="given-name" required>
                        </div>
                        <div>
                            <label for="contact-last-name">Last Name <span class="required-mark" aria-hidden="true">*</span></label>
                            <input type="text" id="contact-last-name" name="lastName" autocomplete="family-name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="contact-email">Email <span class="required-mark" aria-hidden="true">*</span></label>
                        <input type="email" id="contact-email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-row">
                        <label for="contact-phone">Phone <span class="optional-mark">(optional)</span></label>
                        <input type="tel" id="contact-phone" name="phone" autocomplete="tel">
                    </div>

                    <div class="form-row">
                        <label for="contact-subject">Subject</label>
                        <select id="contact-subject" name="subject" required>
                            <option value="custom">Custom request</option>
                            <option value="purchase">Purchase existing piece</option>
                        </select>
                    </div>

                    <div id="purchase-fields" class="purchase-fields" style="display: none;">
                        <div class="form-row">
                            <label for="contact-series">Series</label>
                            <select id="contact-series" name="series">
                                <option value="">Select a series…</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <label for="contact-piece">Piece Name</label>
                            <select id="contact-piece" name="piece" disabled>
                                <option value="">Select a series first…</option>
                            </select>
                        </div>

                        <div class="contact-piece-preview" id="contact-piece-preview" style="display: none;">
                            <img src="" alt="">
                            <div class="contact-piece-details"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="contact-message">Message <span class="required-mark" aria-hidden="true">*</span></label>
                        <textarea id="contact-message" name="message" rows="6" required></textarea>
                    </div>

                    <!-- Honeypot: bots fill this, people never see it -->
                    <div class="form-row contact-honeypot" aria-hidden="true">
                        <label for="contact-company">Company</label>
                        <input type="text" id="contact-company" name="_gotcha" tabindex="-1" autocomplete="off">
                    </div>

                    <p class="required-note"><span class="required-mark" aria-hidden="true">*</span> Required</p>

                    <div class="form-actions">
                        <button type="submit" class="contact-submit" id="contact-submit">Send Message</button>
                        <div class="contact-status" id="contact-status" role="status" aria-live="polite"></div>
                    </div>
                </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-spacer" aria-hidden="true"></div>
            <a class="footer-instagram" id="footer-instagram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram" style="display: none;">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                    <rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/>
                </svg>
            </a>
            <p class="footer-copyright">&copy; 2026 <a href="admin.html" class="footer-name">Abe Weston</a>. All rights reserved.</p>
        </div>
    </footer>

    <script src="navigation.js"></script>
    <script src="contact.js"></script>
</body>
</html>
